name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Lint shell and workflows
        run: |
          shellcheck entrypoint.sh scripts/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Test builds and publishing against local repositories
        run: python3 -m unittest discover -s tests -v
      - name: Exercise the composite build without publishing
        uses: ./
        with:
          project-dir: sample-site
          branch: ci-output
          token: ''
        id: dry-run
        continue-on-error: true
      - name: Confirm missing credentials prevented publishing
        env:
          OUTCOME: ${{ steps.dry-run.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -s sample-site/build/index.html
